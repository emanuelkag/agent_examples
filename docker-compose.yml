services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - ./.data/qdrant:/qdrant/storage
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/neo4jpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./.data/neo4j:/data
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=agentos
      - POSTGRES_PASSWORD=agentos
      - POSTGRES_DB=agentos
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
