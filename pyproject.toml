[project]
name = "agent-os-examples"
version = "0.1.0"
description = "Local-first agent architecture demos (PydanticAI + Ollama + RAG)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pydantic-ai>=0.0.14",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "qdrant-client>=1.9,<1.10",
  "neo4j>=5.15",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "rich>=13.7"
]

[project.optional-dependencies]
sources = [
  "ddgs>=1.0.0",
  "arxiv>=2.1.0",
  "wikipedia>=1.4.0"
]
langgraph = [
  "langgraph>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_os_examples"]
